name: Fetch site photos
on:
  push:
    paths: ['.github/workflows/fetch-photos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Unsplash photos (free Unsplash License)
        run: |
          mkdir -p assets/photos
          dl(){ curl -fsSL "https://images.unsplash.com/photo-$2?auto=format&fm=jpg&fit=crop&w=$3&q=72" -o "assets/photos/$1.jpg"; }
          dl hero 1504307651254-35680f356dfd 1920
          dl svc-building 1508450859948-4e04fabaa4ea 900
          dl svc-plumbing 1676210134188-4c05dd172f89 900
          dl svc-trading 1586057285471-2f78bffaf074 900
          dl svc-maintenance 1749532125405-70950966b0e5 900
          dl svc-pm 1503387762-592deb58ef4e 900
          dl svc-manpower 1541888946425-d81bb19240f5 900
          dl why 1587582423116-ec07293f0395 1000
          dl why-small 1607472586893-edb57bdc0e39 600
          dl sector-villas 1595414440701-da000c40df9c 700
          dl sector-developers 1429497419816-9ca5cfb4571a 700
          dl sector-government 1606813332135-228593b6e201 700
          dl sector-commercial 1558464678-2f1570e8d60e 700
          dl band 1535732759880-bbd5c7265e3f 1600
          ls -la assets/photos
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos
          git commit -m "Add site photos (Unsplash License)" || echo "nothing to commit"
          git push
